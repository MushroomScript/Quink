<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quink - 一念</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/quink-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#748ffc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="text-gray-900 min-h-screen" spellcheck="false">
    <script>
      // 同步设主题 + 同步设 html 背景色：
      // data-theme 让 CSS 变量在加载后立即对应主题，
      // 但 CSS 加载本身要几十毫秒，期间会用浏览器默认白色 paint → 暗色主题用户首次启动看到白闪
      // 解决：在 inline script 里直接给 <html> 设 inline background（跟 style.css 的 --c-body 一致），不依赖 CSS 加载
      (function() {
        var theme = localStorage.getItem('quink_theme') || 'blueberry';
        document.documentElement.setAttribute('data-theme', theme);
        var BG = {blueberry:'#f4f5fc',lavender:'#f6f4fc',mint:'#f2fbf7',peach:'#fdf5f3',lemon:'#fcfaf0',cloud:'#f5f6f8',dark:'#131318'};
        document.documentElement.style.background = BG[theme] || '#f4f5fc';
        // 字体大小同步走 localStorage，避免服务端断开 / preferences 不完整时 fontSize 变回 16px
        var fontSize = localStorage.getItem('quink_font_size');
        if (fontSize) document.documentElement.style.fontSize = fontSize + 'px';
        // favicon 同步切到当前主题，避免启动瞬间标签页图标是默认 blueberry
        var links = document.querySelectorAll('link[rel="icon"]');
        links.forEach(function(link) {
          if (link.type === 'image/png') link.href = '/quink-' + theme + '-192.png';
          else link.href = '/favicon-' + theme + '.ico';
        });
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
