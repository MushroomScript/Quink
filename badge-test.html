<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Badge Test - Quink</title>
<style>
  :root {
    --c-accent: 167 139 250;
    --bg-page: #0f1018;
    --bg-sidebar: rgba(255,255,255,0.04);
    --bg-tab-active: rgba(167,139,250,0.18);
    --text-sb: rgba(255,255,255,0.88);
    --text-dim: rgba(255,255,255,0.55);
    --text-gray: rgba(255,255,255,0.45);
  }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-sb);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }

  /* ── 顶部控制面板 (sticky, 自身不缩放) ── */
  .panel {
    position: sticky; top: 0; z-index: 10;
    background: #1a1c28;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .panel-row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .panel-col { flex: 1; min-width: 320px; }
  .panel-col h3 { margin: 0 0 8px 0; font-size: 12px; color: rgb(192,175,250); text-transform: uppercase; letter-spacing: 0.5px; }
  .panel-shared { padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px dashed rgba(255,255,255,0.1); }

  .ctrl { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .ctrl label { width: 130px; color: var(--text-dim); }
  .ctrl input[type=number] { width: 60px; background: #0f1018; color: var(--text-sb); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 3px 6px; font-family: inherit; font-size: 12px; }
  .ctrl input[type=range] { flex: 1; min-width: 80px; }
  .ctrl .unit { color: var(--text-gray); font-size: 11px; width: 18px; }

  /* ── 示例容器 (受 zoom 影响) ── */
  .container { padding: 24px; }
  .section { margin-bottom: 40px; }
  .section-title { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── 示例 A: 头像菜单 ── */
  .sample-menu { display: flex; flex-direction: column; width: 240px; background: var(--bg-sidebar); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 4px 0; }
  .menu-item { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 14px; color: var(--text-sb); cursor: pointer; }
  .menu-item:hover { background: rgba(255,255,255,0.04); }
  .menu-item .icon { font-size: 16px; line-height: 1; }
  .menu-item .label { flex: 1; }
  .menu-item .row-label { color: var(--text-gray); font-size: 11px; min-width: 32px; }

  /* ── 示例 B: 4 tab ── */
  .sample-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 8px; font-size: 12px; color: var(--text-gray); cursor: pointer; background: transparent; }
  .tab.active { background: var(--bg-tab-active); color: rgb(192, 175, 250); font-weight: 500; }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.04); }

  /* ── badge 核心 (size/字/padding/transform 全 inline 控制) ── */
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(248, 113, 113, 0.7);
    color: #fff;
    line-height: 1;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    border-radius: 9999px;
    box-sizing: border-box;
  }
  .menu-item .badge { margin-left: auto; }
</style>
</head>
<body>

<div class="panel">
  <!-- 共用控制: CSS zoom (模拟 Quink 显示比例) -->
  <div class="panel-shared">
    <div class="ctrl">
      <label>显示比例 (CSS zoom)</label>
      <input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1">
      <input type="number" id="zoomNum" value="1" step="0.05">
      <span class="unit">×</span>
      <span style="color:var(--text-gray); font-size:11px; margin-left:8px;">只缩放下面示例区, 控制面板不动. 跟 Quink html zoom 同款</span>
    </div>
  </div>

  <div class="panel-row">
    <!-- A 控制 -->
    <div class="panel-col">
      <h3>A · 头像菜单 "消息通知" badge</h3>
      <div class="ctrl"><label>min-w</label><input type="range" id="a-minW" min="10" max="24" step="1" value="18"><input type="number" id="a-minWNum" value="18" step="1"><span class="unit">px</span></div>
      <div class="ctrl"><label>height</label><input type="range" id="a-h" min="10" max="24" step="1" value="18"><input type="number" id="a-hNum" value="18" step="1"><span class="unit">px</span></div>
      <div class="ctrl"><label>font-size</label><input type="range" id="a-fs" min="7" max="14" step="0.5" value="11"><input type="number" id="a-fsNum" value="11" step="0.5"><span class="unit">px</span></div>
      <div class="ctrl"><label>translateY</label><input type="range" id="a-ty" min="-3" max="3" step="0.25" value="0.25"><input type="number" id="a-tyNum" value="0.25" step="0.25"><span class="unit">px</span></div>
      <div class="ctrl"><label>padding-top</label><input type="range" id="a-pt" min="0" max="4" step="0.25" value="0"><input type="number" id="a-ptNum" value="0" step="0.25"><span class="unit">px</span></div>
      <div class="ctrl"><label>padding-bottom</label><input type="range" id="a-pb" min="0" max="4" step="0.25" value="1"><input type="number" id="a-pbNum" value="1" step="0.25"><span class="unit">px</span></div>
      <div class="ctrl"><label>1位 px (左右均)</label><input type="range" id="a-px1" min="0" max="8" step="0.5" value="4"><input type="number" id="a-px1Num" value="4" step="0.5"><span class="unit">px</span></div>
      <div class="ctrl"><label>多位 pl</label><input type="range" id="a-plM" min="0" max="8" step="0.5" value="3.5"><input type="number" id="a-plMNum" value="3.5" step="0.5"><span class="unit">px</span></div>
      <div class="ctrl"><label>多位 pr</label><input type="range" id="a-prM" min="0" max="8" step="0.5" value="4.5"><input type="number" id="a-prMNum" value="4.5" step="0.5"><span class="unit">px</span></div>
    </div>

    <!-- B 控制 -->
    <div class="panel-col">
      <h3>B · 4 tab "全部" badge</h3>
      <div class="ctrl"><label>min-w</label><input type="range" id="b-minW" min="10" max="24" step="1" value="14"><input type="number" id="b-minWNum" value="14" step="1"><span class="unit">px</span></div>
      <div class="ctrl"><label>height</label><input type="range" id="b-h" min="10" max="24" step="1" value="14"><input type="number" id="b-hNum" value="14" step="1"><span class="unit">px</span></div>
      <div class="ctrl"><label>font-size</label><input type="range" id="b-fs" min="7" max="14" step="0.5" value="10"><input type="number" id="b-fsNum" value="10" step="0.5"><span class="unit">px</span></div>
      <div class="ctrl"><label>translateY</label><input type="range" id="b-ty" min="-3" max="3" step="0.25" value="0"><input type="number" id="b-tyNum" value="0" step="0.25"><span class="unit">px</span></div>
      <div class="ctrl"><label>padding-top</label><input type="range" id="b-pt" min="0" max="4" step="0.25" value="0.5"><input type="number" id="b-ptNum" value="0.5" step="0.25"><span class="unit">px</span></div>
      <div class="ctrl"><label>padding-bottom</label><input type="range" id="b-pb" min="0" max="4" step="0.25" value="0"><input type="number" id="b-pbNum" value="0" step="0.25"><span class="unit">px</span></div>
      <div class="ctrl"><label>padding 左右</label><input type="range" id="b-px" min="0" max="8" step="0.5" value="4"><input type="number" id="b-pxNum" value="4" step="0.5"><span class="unit">px</span></div>
    </div>
  </div>
</div>

<div id="exampleContainer" class="container">

  <div class="section">
    <div class="section-title">示例 A · 头像菜单"消息通知"风格 (text-sm 14px · 🔔 · 文字 · 右侧 badge · 1:1 复刻当前 Quink)</div>
    <div class="sample-menu" id="sampleMenu"></div>
  </div>

  <div class="section">
    <div class="section-title">示例 B · 4 tab"全部"风格 (text-xs 12px · 主题底 + badge · 1:1 复刻当前 Quink · 第一个 active)</div>
    <div class="sample-tabs" id="sampleTabs"></div>
  </div>

</div>

<script>
  const TEST_NUMBERS = ['1', '2', '5', '7', '9', '10', '11', '23', '56', '88', '99', '99+'];

  function renderMenu() {
    const root = document.getElementById('sampleMenu');
    root.innerHTML = '';
    TEST_NUMBERS.forEach(n => {
      const item = document.createElement('div');
      item.className = 'menu-item';
      item.innerHTML = `<span class="icon">🔔</span><span class="label">消息通知</span><span class="badge" data-kind="a">${n}</span><span class="row-label">"${n}"</span>`;
      root.appendChild(item);
    });
  }

  function renderTabs() {
    const root = document.getElementById('sampleTabs');
    root.innerHTML = '';
    TEST_NUMBERS.forEach((n, i) => {
      const t = document.createElement('div');
      t.className = 'tab' + (i === 0 ? ' active' : '');
      t.innerHTML = `<span>全部</span><span class="badge" data-kind="b">${n}</span>`;
      root.appendChild(t);
    });
  }

  function val(id) { return parseFloat(document.getElementById(id).value); }

  function applyA() {
    const minW = val('a-minW'), h = val('a-h'), fs = val('a-fs'), ty = val('a-ty');
    const pt = val('a-pt'), pb = val('a-pb');
    const px1 = val('a-px1'), plM = val('a-plM'), prM = val('a-prM');
    document.querySelectorAll('.badge[data-kind="a"]').forEach(b => {
      const n = b.textContent;
      b.style.minWidth = minW + 'px';
      b.style.height = h + 'px';
      b.style.fontSize = fs + 'px';
      b.style.transform = `translateY(${ty}px)`;
      b.style.paddingTop = pt + 'px';
      b.style.paddingBottom = pb + 'px';
      if (n.length > 1) {
        b.style.paddingLeft = plM + 'px';
        b.style.paddingRight = prM + 'px';
      } else {
        b.style.paddingLeft = px1 + 'px';
        b.style.paddingRight = px1 + 'px';
      }
    });
  }

  function applyB() {
    const minW = val('b-minW'), h = val('b-h'), fs = val('b-fs'), ty = val('b-ty');
    const pt = val('b-pt'), pb = val('b-pb'), px = val('b-px');
    document.querySelectorAll('.badge[data-kind="b"]').forEach(b => {
      b.style.minWidth = minW + 'px';
      b.style.height = h + 'px';
      b.style.fontSize = fs + 'px';
      b.style.transform = `translateY(${ty}px)`;
      b.style.paddingTop = pt + 'px';
      b.style.paddingBottom = pb + 'px';
      b.style.paddingLeft = px + 'px';
      b.style.paddingRight = px + 'px';
    });
  }

  function applyZoom() {
    const z = val('zoom');
    document.getElementById('exampleContainer').style.zoom = z;
  }

  function bindAll(ids, fn) {
    ids.forEach(([r, n]) => {
      const rEl = document.getElementById(r), nEl = document.getElementById(n);
      rEl.addEventListener('input', () => { nEl.value = rEl.value; fn(); });
      nEl.addEventListener('input', () => { rEl.value = nEl.value; fn(); });
    });
  }

  bindAll([['a-minW','a-minWNum'],['a-h','a-hNum'],['a-fs','a-fsNum'],['a-ty','a-tyNum'],['a-pt','a-ptNum'],['a-pb','a-pbNum'],['a-px1','a-px1Num'],['a-plM','a-plMNum'],['a-prM','a-prMNum']], applyA);
  bindAll([['b-minW','b-minWNum'],['b-h','b-hNum'],['b-fs','b-fsNum'],['b-ty','b-tyNum'],['b-pt','b-ptNum'],['b-pb','b-pbNum'],['b-px','b-pxNum']], applyB);
  bindAll([['zoom','zoomNum']], applyZoom);

  renderMenu();
  renderTabs();
  applyA();
  applyB();
  applyZoom();
</script>

</body>
</html>
