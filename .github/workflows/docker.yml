name: Build and push Docker image

# 触发: push main / 打 tag v* / 手动触发
# 镜像推到 ghcr.io/<owner>/quink (跟 GitHub repo 绑定, 免费, 不用单独 Docker Hub 账号)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # GitHub Actions 页面 "Run workflow" 按钮手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推 GHCR 必须. 不开 Actions 报 401
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 镜像路径必须小写, GitHub username 可能大写 (例 MushroomScript) → 转小写
      - name: Set lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成 tags:
      # - latest (main 分支)
      # - main (branch name)
      # - sha-<commit> (每次 push)
      # - v0.1.0 / 0.1 (打 tag v0.1.0 时)
      # 用 GitHub Actions expression 替代 metadata-action 的 {{is_default_branch}} 模板, 后者在某些 repo
      # 不可靠 (实测: workflow 跑通但 latest tag 没 emit, 只剩 sha-xxx). expression 直接判断 ref 100% work
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/quink
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache: 第二次起 build 走 cache 快 5-10x
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # GitHub runner 在海外, 直连 deb.debian.org / npmjs.org 快, 不需要 mirror
          # APT_MIRROR / NPM_MIRROR 默认空, Dockerfile 内 if 跳过 sed
          platforms: linux/amd64
          # 想推 ARM (树莓派 / NAS ARM 用户): 加 linux/arm64 但 build 时间翻倍
