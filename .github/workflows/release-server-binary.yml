name: Release server binary

# 触发:
# 1. workflow_dispatch: GitHub Actions 页面手动 "Run workflow" 按钮 (iterate 用)
# 2. push tag server-v*: 自动 build + 发布到 Release (稳定后用)
on:
  workflow_dispatch:
  push:
    tags: ['server-v*']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台 fail 不阻其他
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-gyp 10 子目录 require distutils, Python 3.12+ 已移除. 装 Python 3.11 让 better-sqlite3/sharp
      # 的 native rebuild 在 mac/linux 跑通 (跟 desktop workflow 一致). Windows 走 MSBuild 不受影响.
      - name: Setup Python 3.11 (node-gyp distutils compat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pin pnpm 10 (跟 Dockerfile / desktop workflow 一致)
      - name: Install pnpm
        run: npm install -g pnpm@10

      # 装 packages/server 跟整个 monorepo 依赖. pkg 需要拿到 better-sqlite3 / sharp 这种 native module
      # 编译产物 (build/Release/*.node), 必须在原平台 install + rebuild
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 同 desktop workflow, force install scripts (pkg-fetch download node binary 需要)
      - name: Force run postinstall scripts (pkg native binaries)
        shell: bash
        run: |
          pnpm rebuild @yao-pkg/pkg pkg-fetch better-sqlite3 sharp 2>&1 || true

      # Windows pkg fabricator 跑临时 binary 时 Win Defender 实时扫描拦截 → spawn UNKNOWN (errno -4094)
      # 临时禁 real-time monitoring + 加 workspace / pkg cache 排除路径. GHA runner 默认 admin 权限可改 Defender
      - name: Disable Defender for pkg fabricator (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.pkg-cache" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess pkg.exe -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess node.exe -ErrorAction SilentlyContinue
          Write-Host "Defender real-time monitoring disabled + workspace excluded"

      # 前端要打进 server 二进制 (单文件含 SPA): copy vditor 静态文件 → build web → copy-web-dist
      # 到 node_modules/quink-web-dist (pkg assets 引用它). 不做这步 server 二进制起来前端 404.
      - name: Build web (打进 server 二进制的前端 SPA)
        shell: bash
        run: |
          mkdir -p packages/web/public/vditor
          cp -r node_modules/vditor/dist packages/web/public/vditor/dist
          pnpm --filter @quink/web build

      # 每个 runner 只 build 自己平台的 target —— better-sqlite3/sharp native 不能跨平台编译, pkg 全
      # targets 会产其他平台的坏包. 产物名 quink-server-<platform>-<arch> 已含平台 arch, 不用再 rename.
      - name: Build server binary (current platform, tsc → esbuild → copy-web → pkg)
        shell: bash
        run: |
          cd packages/server
          node scripts/copy-web-dist.mjs
          pnpm run build
          pnpm run build:bundle
          case "${{ matrix.os }}" in
            windows-latest) TARGET=node22-win-x64 ;;
            macos-latest)   TARGET=node22-macos-arm64 ;;
            ubuntu-latest)  TARGET=node22-linux-x64 ;;
          esac
          echo "pkg target: $TARGET"
          pnpm exec pkg . --targets "$TARGET"
          chmod +x dist-binary/quink-server-* 2>/dev/null || true
          ls -la dist-binary/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quink-server-${{ matrix.os }}
          path: packages/server/dist-binary/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/server-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Quink Server Binary ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
