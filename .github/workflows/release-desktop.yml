name: Release desktop client

# 触发方式:
# 1. workflow_dispatch: GitHub Actions 页面手动 "Run workflow" 按钮 (开发期间用这个 iterate)
# 2. push tag desktop-v*: 自动打包 + 创建 Release (alpha 稳定后用)
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台失败不阻塞其他平台 (Win build 失败也能拿到 Mac/Linux 产物)
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # node-gyp 10 子目录的 gyp/ 老代码 require distutils, Python 3.12+ 已经移除. 装 Python 3.11
      # (含 distutils) 让 mac/linux native rebuild 跑通. Windows 不受影响 (走 MSBuild 不用 Python gyp)
      - name: Setup Python 3.11 (node-gyp distutils compat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # uiohook-napi 在 Linux 上用 X11 API 做全局快捷键监听, native compile 需要 X11 dev headers
      - name: Install X11 dev libraries (Linux, uiohook-napi native build deps)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev \
            libxtst-dev \
            libxt-dev \
            libxinerama-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxi-dev

      # Windows native compile 之前卡 "preparing" hang. 显式 setup MSVC env (cl.exe + INCLUDE + LIB)
      # 让 node-gyp 直接用, 不走 VS auto-detect 路径
      - name: Setup MSVC environment (Windows, native compile)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # pin pnpm 10 (跟 Dockerfile 一致, 防 pnpm 11 严格行为)
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # pnpm 10 onlyBuiltDependencies + pnpm rebuild 实测都不让 app-builder-bin postinstall 跑
      # 直接用 npm 在 packages/desktop 装 electron-builder, npm 100% 跑 postinstall download app-builder binary.
      # 装到 packages/desktop/node_modules, electron-builder 跑时 cwd 优先找这里
      - name: Setup electron-builder via npm (bypass pnpm strict install scripts)
        working-directory: packages/desktop
        shell: bash
        run: |
          npm install --no-save --no-fund --no-audit --legacy-peer-deps electron-builder@25.1.8 electron@35.0.0
          # 诊断: 看 app-builder.exe / app-builder 是否真的存在
          ls -la node_modules/app-builder-bin/win/x64/ 2>&1 || echo "no win/x64/"
          ls -la node_modules/app-builder-bin/mac/ 2>&1 || echo "no mac/"
          ls -la node_modules/app-builder-bin/linux/x64/ 2>&1 || echo "no linux/x64/"

      # @electron/rebuild 直接 require packages/desktop/node_modules/node-gyp (老版只识 VS 2013-2017),
      # 不看 npm config, 所以全局升级 node-gyp 无效. 必须强制替换 local node-gyp 跟 @electron/rebuild
      # 子目录内的 node-gyp (如果 bundle 了的话)
      - name: Force install node-gyp 10 locally (Windows, replace VS-2017-only old version)
        if: matrix.os == 'windows-latest'
        working-directory: packages/desktop
        shell: pwsh
        run: |
          npm install -g node-gyp@10
          npm config set msvs_version 2022 --global
          # 删 老 node-gyp 强制装 10.x 到 packages/desktop/node_modules
          if (Test-Path node_modules/node-gyp) { Remove-Item -Recurse -Force node_modules/node-gyp }
          npm install --no-save --no-fund --no-audit node-gyp@10
          Write-Host "Local node-gyp version:"
          Get-Content node_modules/node-gyp/package.json | Select-String -Pattern '"version"'
          # @electron/rebuild 如果 bundle 了自己的 node-gyp 子目录也替换
          if (Test-Path node_modules/@electron/rebuild/node_modules/node-gyp) {
            Remove-Item -Recurse -Force node_modules/@electron/rebuild/node_modules/node-gyp
            Copy-Item -Recurse node_modules/node-gyp node_modules/@electron/rebuild/node_modules/node-gyp
            Write-Host "Replaced @electron/rebuild internal node-gyp"
          }

      # Vditor 静态文件 (.gitignore 排了, build 时从 node_modules 复制)
      - name: Copy Vditor static files
        run: |
          mkdir -p packages/web/public/vditor
          cp -r node_modules/vditor/dist packages/web/public/vditor/dist
        shell: bash

      - name: Build web
        run: pnpm --filter @quink/web build

      - name: Build desktop installer
        run: pnpm --filter @quink/desktop dist
        env:
          # electron-builder 在 GitHub Actions 上跑时, GH_TOKEN 用于自动发布. 我们用 softprops/action-gh-release
          # 单独控制 Release, 这里不让 electron-builder 自己发, publish: null in package.json 已禁
          CSC_IDENTITY_AUTO_DISCOVERY: false  # mac 不签名 (没 Apple 开发者账号)
          # node-gyp 在 win-2022 runner 上默认找 VS 2013/2015/2017, 找不到. 显式告诉它用 VS 2022
          # (GHA windows-latest 镜像自带 VS 2022 Enterprise + C++ workload). 在 mac/linux 上这 env 被忽略
          GYP_MSVS_VERSION: '2022'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quink-desktop-${{ matrix.os }}
          path: |
            packages/desktop/dist-electron/*.exe
            packages/desktop/dist-electron/*.dmg
            packages/desktop/dist-electron/*.zip
            packages/desktop/dist-electron/*.AppImage
            packages/desktop/dist-electron/*.deb
          if-no-files-found: ignore
          retention-days: 30

  # 仅 push tag desktop-v* 时跑, 把三平台 artifact 汇总发布到 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write  # 创建 Release 必须
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Quink Desktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
